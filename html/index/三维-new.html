<script type="text/javascript">
    (function () {
        var box = document.getElementById('top-hero-slider');
        if (!box) {
            return;
        }
        var slides = box.querySelectorAll('.top-hero-slide');
        var dots = box.querySelectorAll('.hero-dot');
        if (!slides || slides.length < 2) {
            return;
        }
        var prevBtn = box.querySelector('.hero-arrow.prev');
        var nextBtn = box.querySelector('.hero-arrow.next');
        var i = 0;
        var timer = null;

        function syncActive() {
            slides.forEach(function (slide, idx) {
                slide.classList.toggle('is-active', idx === i);
            });
            if (dots && dots.length) {
                dots.forEach(function (dot, idx) {
                    dot.classList.toggle('is-active', idx === i);
                });
            }
        }

        function go(nextIndex) {
            i = (nextIndex + slides.length) % slides.length;
            syncActive();
        }

        function play() {
            timer = setInterval(function () {
                go(i + 1);
            }, 3000);
        }

        function resetPlay() {
            if (timer) {
                clearInterval(timer);
            }
            play();
        }

        if (prevBtn) {
            prevBtn.addEventListener('click', function (e) {
                e.preventDefault();
                go(i - 1);
                resetPlay();
            });
        }
        if (nextBtn) {
            nextBtn.addEventListener('click', function (e) {
                e.preventDefault();
                go(i + 1);
                resetPlay();
            });
        }
        if (dots && dots.length) {
            dots.forEach(function (dot) {
                dot.addEventListener('click', function (e) {
                    e.preventDefault();
                    var idx = parseInt(dot.getAttribute('data-index'), 10);
                    if (!isNaN(idx)) {
                        go(idx);
                        resetPlay();
                    }
                });
            });
        }
        syncActive();
        play();
    })();
</script>

<script>
    // 兜底：强制侧边栏可点（兼容右侧脚本事件冲突场景）
    (function () {
        var goTopSelector = [
            '.wpsidebar02 li.sgotop',
            '.wpsidebar02 li.sgotop img',
            '.wpsidebar03 .sgotop',
            '.wpsidebar03 .sgotop img',
            'li.sgotopdd',
            'li.sgotopdd img',
            '.wp_celan_content p.ptop'
        ].join(', ');

        function scrollToTopNow() {
            var sc = document.getElementById('scroll_container');
            if (sc) {
                sc.scrollTop = 0;
            }
            document.documentElement.scrollTop = 0;
            document.body.scrollTop = 0;
            if (window.jQuery) {
                window.jQuery('#scroll_container').stop(true).animate({scrollTop: 0}, 300);
                window.jQuery('html, body').stop(true).animate({scrollTop: 0}, 300);
            }
            if (window.scrollTo) {
                try {
                    window.scrollTo({top: 0, behavior: 'smooth'});
                } catch (err) {
                    window.scrollTo(0, 0);
                }
            }
        }

        function hidePanels() {
            var panels = document.querySelectorAll('.wpsidebar02 .fkf-item-right');
            for (var i = 0; i < panels.length; i++) {
                panels[i].style.display = 'none';
            }
        }

        document.addEventListener('click', function (e) {
            var topTarget = e.target && e.target.closest ? e.target.closest(goTopSelector) : null;
            if (topTarget) {
                e.preventDefault();
                e.stopPropagation();
                scrollToTopNow();
                return;
            }

            var item = e.target.closest && e.target.closest('.wpsidebar02 .fkf-item');
            if (!item) {
                hidePanels();
                return;
            }

            var panel = item.querySelector('.fkf-item-right');
            if (!panel) return;

            e.preventDefault();
            var isOpen = window.getComputedStyle(panel).display !== 'none';
            hidePanels();
            panel.style.display = isOpen ? 'none' : 'block';
        }, true);
    })();
</script>
<script>
// 兜底：部分环境下第三方脚本会把 html 锁成 overflow:hidden，导致页面无法滚动
(function () {
    function unlockScroll() {
        var de = document.documentElement;
        var body = document.body;
        var sc = document.getElementById('scroll_container');

        if (de) {
            de.style.overflowY = 'auto';
            de.style.overflowX = 'hidden';
            de.style.height = 'auto';
        }
        if (body) {
            body.style.overflowY = 'auto';
            body.style.overflowX = 'hidden';
            body.style.height = 'auto';
        }
        if (sc) {
            sc.style.height = 'auto';
            sc.style.overflow = 'visible';
            sc.style.overflowY = 'visible';
            sc.style.overflowX = 'hidden';
        }
    }

    unlockScroll();
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', unlockScroll);
    }
    window.addEventListener('load', unlockScroll);
    setTimeout(unlockScroll, 300);
    setTimeout(unlockScroll, 1200);
    setTimeout(unlockScroll, 2500);
})();
</script>

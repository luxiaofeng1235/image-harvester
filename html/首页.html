        // 兜底：点击“向上”图标强制回到顶部（兼容动态侧栏、jQuery/非 jQuery 场景）
        (function () {
            var goTopSelector = [
                '.wpsidebar02 li.sgotop',
                '.wpsidebar02 li.sgotop img',
                '.wpsidebar03 .sgotop',
                '.wpsidebar03 .sgotop img',
                'li.sgotopdd',

            ].join(', ');

            function scrollToTopNow() {
                var sc = document.getElementById('scroll_container');
                if (sc) {
                    sc.scrollTop = 0;
                }
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;
                if (window.jQuery) {
                    window.jQuery('#scroll_container').stop(true).animate({scrollTop: 0}, 300);
                    window.jQuery('html, body').stop(true).animate({scrollTop: 0}, 300);
                }
                if (window.scrollTo) {
                    try {
                        window.scrollTo({top: 0, behavior: 'smooth'});
                    } catch (err) {
                        window.scrollTo(0, 0);
                    }
                }
            }

            document.addEventListener('click', function (e) {
                var target = e.target && e.target.closest ? e.target.closest(goTopSelector) : null;
                if (!target) {
                    return;
                }
                e.preventDefault();
                e.stopPropagation();
                scrollToTopNow();
            }, true);
        })();

            canvas.children('.cstlayer, .full_column').each(function(){
                var $el = $(this);
                if($el.css('display') === 'none') return;
                var t = parseInt($el.css('top')) || 0;

                var bottom = t + h;
                if(bottom > maxBottom) maxBottom = bottom;
            });
            if(maxBottom > 0){
                canvas.css('height', maxBottom + 'px');
                $('#scroll_container_bg').css('height', (maxBottom - 867) + 'px');

    <script>
    // 修复：直接用 Velocity 执行动画，绕过 showEffects 的 _getEffectDom 问题
    (function(){
        var effectMap = {
            'small2big': function(el, opts){
                var dur = (opts.duration || 1.2) * 1000;
                $.Velocity.hook(el, "scale", "0.5");
                $.Velocity.hook(el, "opacity", "0");
                el.velocity({scale:[1,0.5], opacity:[1,0]}, {duration:dur, display:'block', easing:'ease-in'});
            },
            'fadeFromBottom': function(el, opts){
                var dur = (opts.duration || 1.2) * 1000;
                var oriTop = parseInt(el.css('top')) || 0;
                el.css({top: (oriTop + 200) + 'px', opacity: 0});
                el.velocity({top: oriTop + 'px', opacity: 1}, {duration:dur, display:'block', easing:'ease-out'});
            },
            'fadeFromTop': function(el, opts){
                var dur = (opts.duration || 1.2) * 1000;
                var oriTop = parseInt(el.css('top')) || 0;
                el.css({top: (oriTop - 200) + 'px', opacity: 0});
                el.velocity({top: oriTop + 'px', opacity: 1}, {duration:dur, display:'block', easing:'ease-out'});
            },
            'fadeFromLeft': function(el, opts){
                var dur = (opts.duration || 1.2) * 1000;
                var oriLeft = parseInt(el.css('left')) || 0;
                el.css({left: (oriLeft - 200) + 'px', opacity: 0});
                el.velocity({left: oriLeft + 'px', opacity: 1}, {duration:dur, display:'block', easing:'ease-out'});
            },
            'fadeFromRight': function(el, opts){
                var dur = (opts.duration || 1.2) * 1000;
                var oriLeft = parseInt(el.css('left')) || 0;
                el.css({left: (oriLeft + 200) + 'px', opacity: 0});
                el.velocity({left: oriLeft + 'px', opacity: 1}, {duration:dur, display:'block', easing:'ease-out'});
            }
        };

        function isInView(el){
            var container = $('#scroll_container');
            var fold = container.scrollTop();
            var ch = container.height();
            var elTop = el.ab_pos_cnter ? el.ab_pos_cnter('top') : parseInt(el.css('top')) || 0;
            return (fold + ch) > elTop;
        }

        function fixEffects(){
            var container = $('#scroll_container');
            $('.cstlayer').each(function(){
                var el = $(this);
                var effects = el.data('wopop_effects');
                if(!effects || !effects.effect) return;
                if(el.css('display') !== 'none') return;
                if(el.data('_fix_done')) return;

                var fn = effectMap[effects.effect];
                if(!fn) { el.show(); el.data('_fix_done', true); return; }

                if(isInView(el)){
                    el.data('_fix_done', true);
                    fn(el, effects);
                }
            });
        }

        // 绑定滚动事件持续检测
        var timer;
        $('#scroll_container').on('scroll.fixeffects', function(){
            clearTimeout(timer);
            timer = setTimeout(fixEffects, 30);
        });

        // 首屏尽快执行，避免线上资源较慢时动画晚出现
        function queueFixEffects() {
            if (window.requestAnimationFrame) {
                window.requestAnimationFrame(fixEffects);
            } else {
                setTimeout(fixEffects, 0);
            }
        }

        $(queueFixEffects);
        $(window).on('load', queueFixEffects);
        setTimeout(queueFixEffects, 120);
        setTimeout(queueFixEffects, 450);
        setTimeout(queueFixEffects, 1000);
    })();
    </script>

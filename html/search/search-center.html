<link rel="stylesheet" href="https://static.jsss999.com/upload/zrsite/search/search-page.css?v=20260316-search-7" />
<link rel="stylesheet" href="https://static.jsss999.com/upload/zrsite/slider/category-sidebar-v1.css" />

<div
  class="zr-search-app"
  data-api-base="https://www.zgzonre.com/wp-json/wp/v2/"
  data-detail-url="https://www.zgzonre.com/detail-base"
  data-default-cover="https://static.jsss999.com/upload/zrsite/search/no_cover.webp"
  data-page-size="10"
>
  <main class="zr-search-page">
    <section class="zr-search-shell zr-search-hero">
      <p class="zr-search-eyebrow">Search Center</p>
      <h1 class="zr-search-title">站内搜索</h1>
      <p class="zr-search-description">
        支持站内内容检索与分页浏览，结果点击后统一进入新的详情页。
      </p>

      <form id="zr-search-form" class="zr-search-form" action="" method="get" role="search">
        <label class="zr-search-field" for="zr-search-keyword">
          <span class="zr-search-field-label">关键词</span>
          <input
            id="zr-search-keyword"
            class="zr-search-input"
            name="q"
            type="search"
            placeholder="请输入关键词"
            autocomplete="off"
          />
        </label>
        <button id="zr-search-submit" class="zr-search-submit" type="submit">搜索</button>
      </form>
    </section>

    <section class="zr-search-shell zr-search-results-section">
      <div class="zr-search-results-head">
        <div>
          <h2>搜索结果</h2>
          <p id="zr-search-summary" class="zr-search-summary">请输入关键词开始搜索。</p>
        </div>
      </div>

      <div id="zr-search-loading" class="zr-search-loading" hidden>
        <div class="zr-search-loading-panel">
          <svg class="zr-search-loading-spinner" viewBox="0 0 50 50" aria-hidden="true">
            <circle class="zr-search-loading-path" cx="25" cy="25" r="20" fill="none"></circle>
          </svg>
          <p class="zr-search-loading-text">正在加载搜索结果...</p>
        </div>
      </div>

      <div id="zr-search-error" class="zr-search-state zr-search-state-error" hidden></div>
      <div id="zr-search-empty" class="zr-search-state" hidden></div>

      <div id="zr-search-results" class="zr-search-results" hidden></div>
      <nav id="zr-search-pagination" class="zr-search-pagination" aria-label="搜索分页" hidden></nav>
    </section>
  </main>
</div>

<script src="https://static.jsss999.com/upload/zrsite/search/search-api.js?v=20260316-search-6"></script>
<script src="https://static.jsss999.com/upload/zrsite/search/search-page.js?v=20260316-search-8"></script>

# Default configuration
keywords: []
out: ./data
count: 50
concurrency: 8
strict_order: true
rate_limit:
  default: 0.5
  baidu: 0.5
fetch_overage: 2
probe_bytes: 262144
hash_algo: sha1
sizes: []
size_rules:
  - "w>=1200,h>=200"

sources:
  baidu:
    enabled: true

dedupe:
  url: true
  content_hash: true
  perceptual_hash: false

blocked_domains:
  - pic.quanjing.com

timeout: 20
log_dir: ./logs
log_level: INFO

stamp_input: ./data
stamp_output: ./out
stamp_font: ./fonts/msyh.ttf
stamp_logo: ./images/logo.png
stamp_logo_scale: 0.12
stamp_logo_max_h: 0.2
stamp_padding: 10
stamp_opacity: 0.95
stamp_bold_radius: 1
stamp_scale: 0.055
